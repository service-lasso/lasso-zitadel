name: Release

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact: dist/lasso-zitadel-v4.14.0-win32.zip
          - os: ubuntu-latest
            platform: linux
            artifact: dist/lasso-zitadel-v4.14.0-linux.tar.gz
          - os: macos-15-intel
            platform: darwin
            artifact: dist/lasso-zitadel-v4.14.0-darwin.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify package
        run: npm test
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          ZITADEL_VERSION: v4.14.0

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: lasso-zitadel-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

      - name: Upload verify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.platform }}
          path: output/verify
          if-no-files-found: warn
