name: Release

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-runner-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify scanner process failure and deadline contracts
        run: python3 -B scripts/test-macos11-security-runner.py
      - name: Reject affected or substituted supported default package proofs
        run: python3 scripts/test-supported-defaults.py
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: 1.26.8
          cache: false
      - name: Independent default binary inspection and benign native build controls
        run: |
          python3 scripts/test-default-binary-inspection.py
          python3 scripts/test-default-binary-inspection.py --real
      - name: Verify authenticated dependency overlay and source custody
        run: python3 -B scripts/test-macos11-dependency-recipe.py
      - name: Verify exact producer preflight preserves a fresh checkout
        run: python3 scripts/test-producer-checkout-clean.py

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact: dist/lasso-zitadel-v4.14.0-win32.zip
          - os: ubuntu-latest
            platform: linux
            artifact: dist/lasso-zitadel-v4.14.0-linux.tar.gz
          - os: macos-15-intel
            platform: darwin
            artifact: dist/lasso-zitadel-v4.14.0-darwin.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify package
        run: npm test
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          ZITADEL_VERSION: v4.14.0
          ZITADEL_PACKAGE_PROFILE: official-baseline

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-official-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

      - name: Upload verify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.platform }}
          path: output/verify
          if-no-files-found: warn
